<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya Magic</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: Georgia, 'Times New Roman', serif; }

canvas#scene { position: fixed; inset: 0; z-index: 0; display: block; }

/* ═══════════════════════════════════════════════════════════════
   LOADING OVERLAY
   ═══════════════════════════════════════════════════════════════ */
#loading {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #0a0a1a; color: #c8a86e;
}
#loading p { font-size: 20px; opacity: 0.8; margin-bottom: 20px; }
#progress-bar-bg {
  width: 260px; height: 6px; background: rgba(200,168,110,0.15);
  border-radius: 3px; overflow: hidden;
}
#progress-bar {
  width: 0%; height: 100%; background: #c8a86e;
  border-radius: 3px; transition: width 0.2s;
}
#loading .error-msg {
  display: none; margin-top: 20px; font-size: 16px; color: #ff6644;
  max-width: 400px; text-align: center; line-height: 1.5;
}

/* ═══════════════════════════════════════════════════════════════
   TITLE OVERLAY
   ═══════════════════════════════════════════════════════════════ */
#title-screen {
  position: fixed; inset: 0; z-index: 100;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(10,10,26,0.75); color: #c8a86e; text-align: center;
  cursor: pointer; user-select: none;
}
#title-screen h1 {
  font-size: clamp(36px, 8vw, 72px); letter-spacing: 8px;
  text-shadow: 0 0 30px rgba(255,215,0,0.4), 0 0 60px rgba(255,215,0,0.2);
}
#title-screen .subtitle {
  font-size: clamp(14px, 3vw, 22px); opacity: 0.7; margin-top: 10px;
  font-style: italic;
}
#title-screen .enter-prompt {
  margin-top: 50px; font-size: 18px; opacity: 0.5;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

/* ═══════════════════════════════════════════════════════════════
   DEBUG / FPS OVERLAY
   ═══════════════════════════════════════════════════════════════ */
#debug-overlay {
  position: fixed; top: 16px; right: 16px; z-index: 200;
  font-size: 12px; color: #0f0; font-family: monospace;
  display: none; text-align: right; line-height: 1.6;
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════════
   WAND STATUS INDICATOR
   ═══════════════════════════════════════════════════════════════ */
#wand-status {
  position: fixed; top: 16px; left: 16px; z-index: 200;
  font-size: 12px; color: #c8a86e; font-family: monospace;
  opacity: 0.6; pointer-events: none;
  transition: opacity 0.5s;
}
#wand-status.active { color: #4f4; opacity: 0.8; }
#wand-status.denied { color: #f64; opacity: 0.8; }

/* ═══════════════════════════════════════════════════════════════
   SPELL HINT BAR
   ═══════════════════════════════════════════════════════════════ */
#spell-hints {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 200; font-size: 13px; color: #c8a86e; font-family: Georgia, serif;
  opacity: 0.8; pointer-events: none; text-align: center;
  transition: opacity 2s ease;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
}
#spell-hints.faded { opacity: 0.2; }

/* ═══════════════════════════════════════════════════════════════
   COOLDOWN INDICATOR
   ═══════════════════════════════════════════════════════════════ */
#cooldown-indicator {
  position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
  z-index: 200; width: 36px; height: 36px;
  pointer-events: none; opacity: 0;
  transition: opacity 0.3s;
}
#cooldown-indicator.active { opacity: 0.8; }
#cooldown-indicator svg { width: 100%; height: 100%; }
#cooldown-indicator circle.bg { fill: none; stroke: rgba(200,168,110,0.2); stroke-width: 3; }
#cooldown-indicator circle.fg {
  fill: none; stroke: #c8a86e; stroke-width: 3;
  stroke-dasharray: 100.53; stroke-dashoffset: 100.53;
  transform: rotate(-90deg); transform-origin: center;
  transition: stroke-dashoffset 0.1s linear;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.168.0",
    "three/addons/": "https://esm.sh/three@0.168.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>

<!-- Loading overlay with progress bar -->
<div id="loading">
  <p>Loading your magic...</p>
  <div id="progress-bar-bg"><div id="progress-bar"></div></div>
  <p class="error-msg" id="error-msg"></p>
</div>

<!-- Title overlay -->
<div id="title-screen">
  <h1>MAYA MAGIC</h1>
  <p class="subtitle">Wave your wand. Speak your spell.</p>
  <p class="enter-prompt">Click to Enter</p>
</div>

<!-- Debug overlay -->
<div id="debug-overlay"></div>

<!-- Wand status indicator -->
<div id="wand-status"></div>

<!-- Spell hint bar -->
<div id="spell-hints">Say: Lumos · Glacius · Ignis · Levitas · Nova · Tempest &nbsp;|&nbsp; or press 1-6</div>

<!-- Cooldown indicator -->
<div id="cooldown-indicator">
  <svg viewBox="0 0 36 36">
    <circle class="bg" cx="18" cy="18" r="16"/>
    <circle class="fg" cx="18" cy="18" r="16"/>
  </svg>
</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════
   IMPORTS
   ═══════════════════════════════════════════════════════════════ */
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ═══════════════════════════════════════════════════════════════
   DOM REFS
   ═══════════════════════════════════════════════════════════════ */
const $loading = document.getElementById('loading');
const $progressBar = document.getElementById('progress-bar');
const $errorMsg = document.getElementById('error-msg');
const $titleScreen = document.getElementById('title-screen');

/* ═══════════════════════════════════════════════════════════════
   FILE:// PROTOCOL CHECK — Chrome blocks fetch() on file:// URLs
   ═══════════════════════════════════════════════════════════════ */
if (window.location.protocol === 'file:') {
  $loading.innerHTML = `
    <div style="text-align:center; color: #c8a030; padding: 2rem;">
      <h2 style="font-family: Georgia, serif;">Cannot load from file://</h2>
      <p style="color: #888; margin-top: 1rem;">Chrome blocks 3D model loading from local files. Run this in your terminal:</p>
      <code style="display: block; background: #1a1a2e; padding: 1rem; margin: 1rem auto; border-radius: 8px; color: #ffdd88; max-width: 400px;">bash start.sh</code>
      <p style="color: #888; margin-top: 0.5rem;">Or manually:</p>
      <code style="display: block; background: #1a1a2e; padding: 1rem; margin: 1rem auto; border-radius: 8px; color: #ffdd88; max-width: 400px;">python3 -m http.server 8000</code>
      <p style="color: #888; margin-top: 0.5rem;">Then open <a href="http://localhost:8000" style="color: #c8a030;">http://localhost:8000</a></p>
    </div>
  `;
  throw new Error('file:// protocol detected — need HTTP server for model loading');
}
const $debugOverlay = document.getElementById('debug-overlay');
const canvas = document.getElementById('scene');

/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
let debugMode = false;
let fpsFrames = 0;
let fpsTime = 0;
let fps = 60;

// Wand detection state
let wandActive = false;
let wandVideo = null;
let wandCanvas = null;
let wandCtx = null;
let prevFrame = null;
let smoothX = 80;   // EMA-smoothed tip position (center of 160x120)
let smoothY = 60;
const WAND_W = 160;
const WAND_H = 120;
const DIFF_THRESHOLD = 30;   // per-channel threshold
const SUM_THRESHOLD = 90;    // sum of abs diffs across RGB
const MOTION_MIN = 0.002;    // minimum motion ratio to register a wand
const EMA_ALPHA = 0.4;       // smoothing factor
const $wandStatus = document.getElementById('wand-status');

// Spell & voice state
let recognition = null;
let speaking = false;
const speechQueue = [];
let audioCtx = null;
let lastSpellTime = 0;
const SPELL_COOLDOWN = 5000;
let spellCount = 0;
const spellState = { active: false, type: null, startTime: 0, originalValues: {}, tempObjects: [] };
let candleIntensityMultiplier = 1.0;
let candleColorOverride = null;
let meshByName = {};
let wandPresent = false;
let wandPresentTime = 0;
let lastWandVoiceTime = 0;
let lastSpellVoiceTime = 0;
let cameraShake = { active: false, intensity: 0, endTime: 0 };

// UI refs
const $spellHints = document.getElementById('spell-hints');
const $cooldownIndicator = document.getElementById('cooldown-indicator');
const $cooldownFg = document.querySelector('#cooldown-indicator circle.fg');
const COOLDOWN_CIRCUMFERENCE = 2 * Math.PI * 16; // r=16

/* ═══════════════════════════════════════════════════════════════
   RENDERER
   ═══════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ═══════════════════════════════════════════════════════════════
   SCENE + CAMERA
   ═══════════════════════════════════════════════════════════════ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 3, 8);
camera.lookAt(0, 2, 0);

/* ═══════════════════════════════════════════════════════════════
   ORBIT CONTROLS
   ═══════════════════════════════════════════════════════════════ */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.minDistance = 2;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.85;
controls.target.set(0, 2, 0);

/* ═══════════════════════════════════════════════════════════════
   POST-PROCESSING
   ═══════════════════════════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.0,   // strength
  0.4,   // radius
  0.7    // threshold
);
composer.addPass(bloomPass);

/* ═══════════════════════════════════════════════════════════════
   LIGHTING
   ═══════════════════════════════════════════════════════════════ */
// Ambient
const ambientLight = new THREE.AmbientLight(0x554433, 1.0);
scene.add(ambientLight);

// 4 candle point lights
const candleLightData = [
  { pos: [-2, 3, -1] },
  { pos: [2, 3, 1] },
  { pos: [0, 4, -2] },
  { pos: [-1, 2, 2] },
];
const candleLights = candleLightData.map((d, i) => {
  const light = new THREE.PointLight(0xffaa44, 2.0, 20);
  light.decay = 1;
  light.position.set(...d.pos);
  // At least 2 cast shadows
  if (i < 2) {
    light.castShadow = true;
    light.shadow.mapSize.width = 512;
    light.shadow.mapSize.height = 512;
  }
  scene.add(light);
  return light;
});

// Moonlight (directional)
const moonLight = new THREE.DirectionalLight(0x4466aa, 0.6);
moonLight.position.set(3, 6, -4);
moonLight.castShadow = true;
moonLight.shadow.mapSize.width = 1024;
moonLight.shadow.mapSize.height = 1024;
moonLight.shadow.camera.near = 0.1;
moonLight.shadow.camera.far = 20;
moonLight.shadow.camera.left = -8;
moonLight.shadow.camera.right = 8;
moonLight.shadow.camera.top = 8;
moonLight.shadow.camera.bottom = -2;
scene.add(moonLight);

// Hemisphere fill light — cool sky, warm ground, soft fill for shadows
const hemiLight = new THREE.HemisphereLight(0x8888aa, 0x443322, 0.4);
scene.add(hemiLight);

/* ═══════════════════════════════════════════════════════════════
   DUST MOTES — 80 particles via THREE.Points
   ═══════════════════════════════════════════════════════════════ */
const MOTE_COUNT = 80;
const motePositions = new Float32Array(MOTE_COUNT * 3);
const moteSpeeds = new Float32Array(MOTE_COUNT);
const moteOpacities = new Float32Array(MOTE_COUNT);
const motePhases = new Float32Array(MOTE_COUNT);

for (let i = 0; i < MOTE_COUNT; i++) {
  motePositions[i * 3]     = (Math.random() - 0.5) * 8;   // x
  motePositions[i * 3 + 1] = Math.random() * 5;             // y
  motePositions[i * 3 + 2] = (Math.random() - 0.5) * 8;   // z
  moteOpacities[i] = Math.random();
  moteSpeeds[i] = 0.1 + Math.random() * 0.3;
  motePhases[i] = Math.random() * Math.PI * 2;
}

const moteGeometry = new THREE.BufferGeometry();
moteGeometry.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));

const moteMaterial = new THREE.PointsMaterial({
  color: 0xffdd88,
  size: 0.04,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});

const motePoints = new THREE.Points(moteGeometry, moteMaterial);
scene.add(motePoints);

function updateMotes(time) {
  const positions = moteGeometry.attributes.position.array;
  for (let i = 0; i < MOTE_COUNT; i++) {
    const i3 = i * 3;
    // Slow drift upward
    positions[i3 + 1] += moteSpeeds[i] * 0.003;
    // Gentle horizontal sway
    positions[i3] += Math.sin(time * 0.5 + motePhases[i]) * 0.001;
    positions[i3 + 2] += Math.cos(time * 0.4 + motePhases[i]) * 0.001;
    // Wrap around when too high
    if (positions[i3 + 1] > 6) {
      positions[i3 + 1] = -0.5;
      positions[i3] = (Math.random() - 0.5) * 8;
      positions[i3 + 2] = (Math.random() - 0.5) * 8;
    }
  }
  moteGeometry.attributes.position.needsUpdate = true;

  // Oscillating global opacity
  moteMaterial.opacity = 0.4 + Math.sin(time * 0.8) * 0.2;
}

/* ═══════════════════════════════════════════════════════════════
   WAND TRAIL PARTICLES — 1500 pooled via THREE.Points (ring buffer)
   ═══════════════════════════════════════════════════════════════ */
const TRAIL_COUNT = 1500;
const trailPositions = new Float32Array(TRAIL_COUNT * 3);
const trailColors    = new Float32Array(TRAIL_COUNT * 3);
const trailSizes     = new Float32Array(TRAIL_COUNT);
const trailAlphas    = new Float32Array(TRAIL_COUNT);
let trailHead = 0;

// Soft circle texture (32x32 radial gradient)
const trailTexCanvas = document.createElement('canvas');
trailTexCanvas.width = 32;
trailTexCanvas.height = 32;
const trailTexCtx = trailTexCanvas.getContext('2d');
const grad = trailTexCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.4, 'rgba(255,255,255,0.6)');
grad.addColorStop(1, 'rgba(255,255,255,0)');
trailTexCtx.fillStyle = grad;
trailTexCtx.fillRect(0, 0, 32, 32);
const trailTexture = new THREE.CanvasTexture(trailTexCanvas);

const trailGeometry = new THREE.BufferGeometry();
trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
trailGeometry.setAttribute('color',    new THREE.BufferAttribute(trailColors, 3));
trailGeometry.setAttribute('size',     new THREE.BufferAttribute(trailSizes, 1));

const trailMaterial = new THREE.PointsMaterial({
  size: 0.15,
  map: trailTexture,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true,
  sizeAttenuation: true,
});

const trailPoints = new THREE.Points(trailGeometry, trailMaterial);
scene.add(trailPoints);

// Raycaster for NDC → 3D mapping
const wandRaycaster = new THREE.Raycaster();
const ndcVec = new THREE.Vector2();

// Gold → orange → red color palette for trail particles
function trailColor(life) {
  // life: 1.0 = just born (gold), 0.0 = dead (red/transparent)
  const r = 1.0;
  const g = 0.4 + life * 0.45;   // gold (0.85) → orange (0.55) → red-ish (0.4)
  const b = life * 0.2;           // slight warmth at birth, fades to 0
  return [r, g, b];
}

function spawnTrailParticle(worldPos) {
  const idx = trailHead;
  trailHead = (trailHead + 1) % TRAIL_COUNT;
  const i3 = idx * 3;
  trailPositions[i3]     = worldPos.x + (Math.random() - 0.5) * 0.05;
  trailPositions[i3 + 1] = worldPos.y + (Math.random() - 0.5) * 0.05;
  trailPositions[i3 + 2] = worldPos.z + (Math.random() - 0.5) * 0.05;
  const [r, g, b] = trailColor(1.0);
  trailColors[i3] = r;
  trailColors[i3 + 1] = g;
  trailColors[i3 + 2] = b;
  trailSizes[idx] = 0.12 + Math.random() * 0.06;
  trailAlphas[idx] = 1.0;
}

function updateTrailParticles(dt) {
  const fadeRate = 1.2;  // full fade in ~0.8s
  let activeCount = 0;
  for (let i = 0; i < TRAIL_COUNT; i++) {
    if (trailAlphas[i] <= 0) continue;
    trailAlphas[i] -= fadeRate * dt;
    if (trailAlphas[i] < 0) trailAlphas[i] = 0;

    const life = trailAlphas[i];
    if (life > 0) activeCount++;
    const i3 = i * 3;
    // Drift upward slightly
    trailPositions[i3 + 1] += 0.3 * dt;
    // Color fade: gold → orange → red
    const [r, g, b] = trailColor(life);
    trailColors[i3] = r;
    trailColors[i3 + 1] = g;
    trailColors[i3 + 2] = b;
    // Shrink
    trailSizes[i] = trailSizes[i] * (0.97 + life * 0.02);
  }
  trailGeometry.attributes.position.needsUpdate = true;
  trailGeometry.attributes.color.needsUpdate = true;
  trailGeometry.attributes.size.needsUpdate = true;

  // Global opacity modulates by active particle ratio
  trailMaterial.opacity = activeCount > 0 ? 0.9 : 0;
}

/* ═══════════════════════════════════════════════════════════════
   LOAD FBX model
   ═══════════════════════════════════════════════════════════════ */
const loader = new FBXLoader();

function logMeshInfo(object) {
  console.group('Scene meshes loaded:');
  let texturedCount = 0;
  let untexturedCount = 0;
  object.traverse((child) => {
    if (child.isMesh) {
      const verts = child.geometry?.attributes?.position?.count || 0;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      const matNames = mats.map(m => m?.name || '(no material)').join(', ');
      const hasMap = mats.some(m => m && m.map);
      const mapInfo = mats.map(m => {
        if (m && m.map) return `map=${m.map.image?.width}x${m.map.image?.height} colorSpace=${m.map.colorSpace}`;
        return 'map=null';
      }).join(' | ');
      console.log(`  ${child.name || '(unnamed)'} — ${verts} verts, mat="${matNames}", ${mapInfo}`);
      if (hasMap) texturedCount++; else untexturedCount++;
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  console.log(`TEXTURE SUMMARY: ${texturedCount} textured, ${untexturedCount} untextured`);
  console.groupEnd();
}

loader.load(
  'model/source/DumbledoreOffice.fbx',
  // onLoad — FBXLoader returns the Group directly (no wrapper)
  (model) => {
    // Enable shadows on all meshes and log info
    logMeshInfo(model);

    // Fix texture color space — FBX textures need SRGBColorSpace in Three.js r168
    // FBX meshes can have material arrays, so handle both single and array cases
    model.traverse((child) => {
      if (child.isMesh && child.material) {
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        for (const mat of materials) {
          if (mat.map) {
            mat.map.colorSpace = THREE.SRGBColorSpace;
            mat.map.needsUpdate = true;
          }
          mat.needsUpdate = true;
        }
      }
    });

    scene.add(model);

    // Build mesh lookup for spell effects
    model.traverse((child) => {
      if (child.isMesh && child.name) {
        meshByName[child.name] = child;
      }
    });
    console.log(`Mesh catalog: ${Object.keys(meshByName).length} named meshes indexed for spell targeting`);

    // Scale model to ~10 units (native size is ~0.1 units)
    const rawBox = new THREE.Box3().setFromObject(model);
    const rawSize = rawBox.getSize(new THREE.Vector3());
    const rawMax = Math.max(rawSize.x, rawSize.y, rawSize.z);
    const TARGET_SIZE = 10;
    const scaleFactor = TARGET_SIZE / rawMax;
    model.scale.setScalar(scaleFactor);
    console.log(`Model native size: ${rawSize.x.toFixed(3)} x ${rawSize.y.toFixed(3)} x ${rawSize.z.toFixed(3)} — scaling ${scaleFactor.toFixed(1)}x`);

    // Recompute bounding box after scaling
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    // Adjust controls target to model center
    controls.target.copy(center);
    camera.position.set(center.x, center.y + maxDim * 0.3, center.z + maxDim * 0.8);
    camera.lookAt(center);
    controls.update();

    // Camera collision bounds — keep camera inside the room
    controls.maxDistance = maxDim * 0.9;

    console.log(`Scaled bounding box: ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`);
    console.log(`Center: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})`);

    // Hide loading, show title
    $loading.style.display = 'none';
    $titleScreen.style.display = 'flex';

    // Pre-render one frame so scene shows behind title
    composer.render();
  },
  // onProgress
  (xhr) => {
    if (xhr.total > 0) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      $progressBar.style.width = pct + '%';
    }
  },
  // onError
  (error) => {
    console.error('Failed to load FBX model:', error);
    $progressBar.parentElement.style.display = 'none';
    $errorMsg.style.display = 'block';
    $errorMsg.textContent = 'Could not load the magic room. Make sure model/source/DumbledoreOffice.fbx and its textures are present.';
  }
);

/* ═══════════════════════════════════════════════════════════════
   WAND DETECTION — frame differencing on 160x120 hidden canvas
   ═══════════════════════════════════════════════════════════════ */
function detectWand() {
  if (!wandActive || !wandVideo || wandVideo.readyState < 2) return;

  // Draw current frame, downscaled to 160x120
  wandCtx.drawImage(wandVideo, 0, 0, WAND_W, WAND_H);
  const currentFrame = wandCtx.getImageData(0, 0, WAND_W, WAND_H);
  const curr = currentFrame.data;

  if (!prevFrame) {
    prevFrame = currentFrame;
    return;
  }

  const prev = prevFrame.data;
  let totalMotion = 0;
  let sumX = 0;
  let sumY = 0;

  // Frame differencing: compare RGB channels, threshold
  for (let i = 0; i < curr.length; i += 4) {
    const dr = Math.abs(curr[i]     - prev[i]);
    const dg = Math.abs(curr[i + 1] - prev[i + 1]);
    const db = Math.abs(curr[i + 2] - prev[i + 2]);

    if ((dr > DIFF_THRESHOLD || dg > DIFF_THRESHOLD || db > DIFF_THRESHOLD)
        && (dr + dg + db) > SUM_THRESHOLD) {
      const pixelIndex = i / 4;
      const px = pixelIndex % WAND_W;
      const py = Math.floor(pixelIndex / WAND_W);
      sumX += px;
      sumY += py;
      totalMotion++;
    }
  }

  prevFrame = currentFrame;

  // motionRatio denominator is pixel count, NOT byte count (prior learning applied)
  const motionRatio = totalMotion / (WAND_W * WAND_H);

  if (motionRatio < MOTION_MIN) {
    updateWandVoice(false);
    return;   // too little motion, skip
  }

  // Centroid of motion region
  const cx = sumX / totalMotion;
  const cy = sumY / totalMotion;

  // EMA smoothing
  smoothX = smoothX * (1 - EMA_ALPHA) + cx * EMA_ALPHA;
  smoothY = smoothY * (1 - EMA_ALPHA) + cy * EMA_ALPHA;

  // Map 2D tip to NDC (mirror X for natural feel)
  ndcVec.x = -(smoothX / WAND_W) * 2 + 1;
  ndcVec.y = -(smoothY / WAND_H) * 2 + 1;

  // Unproject to 3D at depth 2.0 from camera
  wandRaycaster.setFromCamera(ndcVec, camera);
  const origin = wandRaycaster.ray.origin.clone();
  const dir = wandRaycaster.ray.direction.clone();
  const worldPos = origin.add(dir.multiplyScalar(2.0));

  // Spawn 3-5 trail particles per frame when motion detected
  const count = 3 + Math.floor(Math.random() * 3);
  for (let j = 0; j < count; j++) {
    spawnTrailParticle(worldPos);
  }

  updateWandVoice(true);
}

/* ═══════════════════════════════════════════════════════════════
   TITLE SCREEN — Click to dismiss + request camera
   ═══════════════════════════════════════════════════════════════ */
$titleScreen.addEventListener('click', () => {
  if (wandVideo) return;  // prevent duplicate camera streams on double-click
  $titleScreen.style.display = 'none';

  // Request camera (requires user gesture)
  navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
    .then((stream) => {
      wandVideo = document.createElement('video');
      wandVideo.srcObject = stream;
      wandVideo.setAttribute('playsinline', '');
      wandVideo.style.display = 'none';
      document.body.appendChild(wandVideo);
      wandVideo.play();

      wandCanvas = document.createElement('canvas');
      wandCanvas.width = WAND_W;
      wandCanvas.height = WAND_H;
      wandCtx = wandCanvas.getContext('2d', { willReadFrequently: true });

      wandActive = true;
      $wandStatus.textContent = 'Wand: Ready';
      $wandStatus.className = 'active';
      console.log('Wand detection active (160x120 frame differencing)');

      // Start voice recognition + narrator welcome
      startSpeechRecognition();
      speak(VOICE_LINES.welcome);
    })
    .catch((err) => {
      console.warn('Camera denied or unavailable:', err.message);
      $wandStatus.textContent = 'Wand: Camera off';
      $wandStatus.className = 'denied';
      // Graceful degradation — app works without camera, use keyboard 1-6
      // Still start voice recognition so voice spells work
      startSpeechRecognition();
      speak(VOICE_LINES.welcome);
    });
});

window.addEventListener('beforeunload', () => {
  if (wandVideo && wandVideo.srcObject) {
    wandVideo.srcObject.getTracks().forEach(t => t.stop());
  }
});

/* ═══════════════════════════════════════════════════════════════
   VOICE RECOGNITION — Web Speech API
   ═══════════════════════════════════════════════════════════════ */
function startSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    console.warn('Speech recognition not supported');
    $wandStatus.textContent = 'Voice not supported — use keyboard 1-6';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    const last = event.results[event.results.length - 1];
    if (last.isFinal) {
      const text = last[0].transcript.toLowerCase().trim();
      console.log('[Speech heard]:', text);
      matchSpell(text);
    }
  };

  recognition.onerror = (e) => {
    console.warn('[Speech error]:', e.error);
    if (e.error !== 'no-speech') {
      setTimeout(() => { try { recognition.start(); } catch(ex) {} }, 500);
    }
  };

  recognition.onend = () => {
    if (!speaking) {
      setTimeout(() => { try { recognition.start(); } catch(ex) {} }, 500);
    }
  };

  try { recognition.start(); } catch(ex) {}
  console.log('Speech recognition started');
}

/* ═══════════════════════════════════════════════════════════════
   SPELL ALIASES & MATCHING — fuzzy match for kid mispronunciations
   ═══════════════════════════════════════════════════════════════ */
const SPELL_ALIASES = {
  lumos:   ['lumos', 'loomis', 'luminous', 'lumas', 'lomos', 'loom us', 'loo mos'],
  glacius: ['glacius', 'glassius', 'glassy us', 'glacier', 'glass see us', 'glayceus'],
  ignis:   ['ignis', 'igneous', 'ignus', 'ignite', 'ig nis', 'ignas'],
  levitas: ['levitas', 'levitate', 'levitus', 'elevator', 'lev it us'],
  nova:    ['nova', 'no va', 'super nova', 'supernova', 'no vah'],
  tempest: ['tempest', 'tempes', 'tempus', 'temp est', 'tempost'],
};

function matchSpell(text) {
  for (const [spell, aliases] of Object.entries(SPELL_ALIASES)) {
    for (const alias of aliases) {
      if (text.includes(alias)) {
        triggerSpell(spell);
        return;
      }
    }
  }
  speak(VOICE_LINES.unknown);
}

/* ═══════════════════════════════════════════════════════════════
   NARRATOR — SpeechSynthesis with queue and duplex policy
   ═══════════════════════════════════════════════════════════════ */
const VOICE_LINES = {
  welcome:   'Welcome to Maya Magic. Wave your wand and speak your spell.',
  wandFound: 'Ah, I see your wand! Now, speak a spell!',
  wandLost:  'Where did your wand go? Hold it up for me.',
  lumos:     'Lumos! You command the light!',
  glacius:   'Glacius! The frost obeys you!',
  ignis:     'Ignis! Fire dances at your command!',
  levitas:   'Levitas! Rise! You command the air!',
  nova:      'Nova! A star is born from your wand!',
  tempest:   'Tempest! The winds answer your call!',
  unknown:   'That spell is unknown to me. Try Lumos or Glacius!',
  hint:      'Try saying Lumos while waving your wand!',
  streak3:   'Three spells! You are becoming a true sorcerer!',
  streak5:   'Five spells! The magic council would be impressed!',
};

function speak(text, priority = false) {
  if (priority && speaking) {
    window.speechSynthesis.cancel();
    speaking = false;
  }
  if (speaking) {
    speechQueue.push(text);
    return;
  }
  const utter = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const male = voices.find(v => /daniel|james|english.*male/i.test(v.name))
    || voices.find(v => /en/.test(v.lang));
  if (male) utter.voice = male;
  utter.rate = 0.85;
  utter.pitch = 0.9;
  utter.onstart = () => {
    speaking = true;
    if (recognition) try { recognition.stop(); } catch(ex) {}
  };
  utter.onend = () => {
    speaking = false;
    if (recognition) try { recognition.start(); } catch(ex) {}
    if (speechQueue.length > 0) speak(speechQueue.shift());
  };
  speaking = true;
  window.speechSynthesis.speak(utter);
}

/* ═══════════════════════════════════════════════════════════════
   AUDIO ENGINE — procedural whoosh via Web Audio API
   ═══════════════════════════════════════════════════════════════ */
function playWhoosh() {
  if (!audioCtx) audioCtx = new AudioContext();
  const duration = 0.4;
  const noise = audioCtx.createBufferSource();
  const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.3));
  }
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(800, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + duration);
  filter.Q.value = 1.5;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  noise.connect(filter).connect(gain).connect(audioCtx.destination);
  noise.start();
}

/* ═══════════════════════════════════════════════════════════════
   SPELL TRIGGER & COOLDOWN
   ═══════════════════════════════════════════════════════════════ */
function triggerSpell(spellName) {
  const now = performance.now();
  if (now - lastSpellTime < SPELL_COOLDOWN) return;
  if (spellState.active) return;
  lastSpellTime = now;
  lastSpellVoiceTime = now;
  spellCount++;
  speak(VOICE_LINES[spellName], true);
  playWhoosh();
  activateSpell(spellName);
  // Streak voice lines (delayed so they don't overlap the spell line)
  if (spellCount === 3) setTimeout(() => speak(VOICE_LINES.streak3), 3000);
  if (spellCount === 5) setTimeout(() => speak(VOICE_LINES.streak5), 3000);
  // Start cooldown indicator
  showCooldown();
}

function showCooldown() {
  $cooldownIndicator.classList.add('active');
  $cooldownFg.style.strokeDashoffset = COOLDOWN_CIRCUMFERENCE;
  const startTime = performance.now();
  function updateCooldown() {
    const elapsed = performance.now() - startTime;
    const progress = Math.min(elapsed / SPELL_COOLDOWN, 1);
    $cooldownFg.style.strokeDashoffset = COOLDOWN_CIRCUMFERENCE * (1 - progress);
    if (progress < 1) {
      requestAnimationFrame(updateCooldown);
    } else {
      $cooldownIndicator.classList.remove('active');
    }
  }
  requestAnimationFrame(updateCooldown);
}

/* ═══════════════════════════════════════════════════════════════
   SPELL EFFECTS — 6 spells, each with activate + cleanup
   ═══════════════════════════════════════════════════════════════ */
function getMeshesByPattern(patterns) {
  const results = [];
  for (const [name, mesh] of Object.entries(meshByName)) {
    const lower = name.toLowerCase();
    for (const pat of patterns) {
      if (lower.includes(pat.toLowerCase())) {
        results.push(mesh);
        break;
      }
    }
  }
  return results;
}

function spawnColoredParticle(worldPos, r, g, b) {
  spawnTrailParticle(worldPos);
  const idx = (trailHead - 1 + TRAIL_COUNT) % TRAIL_COUNT;
  const i3 = idx * 3;
  trailColors[i3] = r;
  trailColors[i3 + 1] = g;
  trailColors[i3 + 2] = b;
}

function activateSpell(spellName) {
  spellState.active = true;
  spellState.type = spellName;
  spellState.startTime = performance.now();
  spellState.originalValues = {};
  spellState.tempObjects = [];

  const orig = spellState.originalValues;
  orig.bloomStrength = bloomPass.strength;
  orig.candleMultiplier = candleIntensityMultiplier;
  orig.candleColors = candleLights.map(l => l.color.getHex());

  switch (spellName) {
    case 'lumos': activateLumos(orig); break;
    case 'glacius': activateGlacius(orig); break;
    case 'ignis': activateIgnis(orig); break;
    case 'levitas': activateLevitas(orig); break;
    case 'nova': activateNova(orig); break;
    case 'tempest': activateTempest(orig); break;
  }
}

function activateLumos(orig) {
  candleIntensityMultiplier = 3.0;
  bloomPass.strength = 1.5;
  // Emissive glow on chandeliers and glass lights
  const meshes = getMeshesByPattern(['chandelier', 'glasslight']);
  orig.lumosMeshes = meshes.map(m => {
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    return { mesh: m, origEmissive: mats.map(mt => mt.emissive ? mt.emissive.clone() : new THREE.Color(0)), origEmissiveIntensity: mats.map(mt => mt.emissiveIntensity || 0) };
  });
  for (const entry of orig.lumosMeshes) {
    const mats = Array.isArray(entry.mesh.material) ? entry.mesh.material : [entry.mesh.material];
    for (const mt of mats) {
      if (mt.emissive) { mt.emissive.set(0xffd700); mt.emissiveIntensity = 1.0; }
    }
  }
  // Gold particle burst
  const center = new THREE.Vector3(0, 3, 0);
  for (let i = 0; i < 200; i++) {
    const pos = center.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5));
    spawnColoredParticle(pos, 1.0, 0.84, 0.0);
  }
}

function activateGlacius(orig) {
  candleIntensityMultiplier = 0.15;
  candleColorOverride = new THREE.Color(0x4488cc);
  // Frost tint on walls, floors, curtains
  const meshes = getMeshesByPattern(['stonewall', 'woodfloor', 'curtain']);
  orig.glaciusMeshes = meshes.map(m => {
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    return { mesh: m, origColors: mats.map(mt => mt.color ? mt.color.clone() : new THREE.Color(1, 1, 1)) };
  });
  const frost = new THREE.Color(0x88aadd);
  for (const entry of orig.glaciusMeshes) {
    const mats = Array.isArray(entry.mesh.material) ? entry.mesh.material : [entry.mesh.material];
    mats.forEach((mt, i) => {
      if (mt.color) mt.color.lerp(frost, 0.4);
    });
  }
  // Ice-blue particles drifting down
  for (let i = 0; i < 100; i++) {
    const pos = new THREE.Vector3((Math.random() - 0.5) * 6, 4 + Math.random() * 2, (Math.random() - 0.5) * 6);
    spawnColoredParticle(pos, 0.53, 0.67, 0.87);
  }
}

function activateIgnis(orig) {
  candleIntensityMultiplier = 4.0;
  // Temp orange point light at center
  const fireLight = new THREE.PointLight(0xff6622, 2, 15);
  fireLight.position.set(0, 2, 0);
  scene.add(fireLight);
  spellState.tempObjects.push(fireLight);
  // Scale fire meshes
  const fireMeshes = getMeshesByPattern(['fire01', 'fire02']);
  orig.ignisMeshes = fireMeshes.map(m => ({ mesh: m, origScale: m.scale.clone() }));
  for (const entry of orig.ignisMeshes) {
    entry.mesh.scale.multiplyScalar(2);
  }
  // Orange-red particles shooting up from fire positions
  for (const entry of orig.ignisMeshes) {
    const worldPos = new THREE.Vector3();
    entry.mesh.getWorldPosition(worldPos);
    for (let i = 0; i < 150; i++) {
      const pos = worldPos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.5, Math.random() * 2, (Math.random() - 0.5) * 0.5));
      spawnColoredParticle(pos, 1.0, 0.27, 0.0);
    }
  }
  // If no fire meshes found, spawn from center
  if (fireMeshes.length === 0) {
    for (let i = 0; i < 300; i++) {
      const pos = new THREE.Vector3((Math.random() - 0.5) * 2, 1 + Math.random() * 3, (Math.random() - 0.5) * 2);
      spawnColoredParticle(pos, 1.0, 0.27, 0.0);
    }
  }
}

function activateLevitas(orig) {
  const meshes = getMeshesByPattern(['documents', 'cabinetsprops', 'prophecyorb']);
  orig.levitasMeshes = meshes.map(m => ({
    mesh: m, origPos: m.position.clone(), origRot: m.rotation.clone(),
    floatOffset: 0
  }));
  // Light-blue particles spiraling up
  for (let i = 0; i < 100; i++) {
    const angle = (i / 100) * Math.PI * 4;
    const r = 1.5;
    const pos = new THREE.Vector3(Math.cos(angle) * r, 1 + (i / 100) * 4, Math.sin(angle) * r);
    spawnColoredParticle(pos, 0.6, 0.8, 1.0);
  }
}

function activateNova(orig) {
  bloomPass.strength = 2.0;
  candleIntensityMultiplier = 2.5;
  // Camera shake
  cameraShake = { active: true, intensity: 0.1, endTime: performance.now() + 500 };
  // 500 gold + white particles exploding from center
  const center = new THREE.Vector3(0, 3, 0);
  for (let i = 0; i < 500; i++) {
    const pos = center.clone().add(new THREE.Vector3(
      (Math.random() - 0.5) * 0.3,
      (Math.random() - 0.5) * 0.3,
      (Math.random() - 0.5) * 0.3
    ));
    if (Math.random() > 0.5) {
      spawnColoredParticle(pos, 1.0, 0.84, 0.0); // gold
    } else {
      spawnColoredParticle(pos, 1.0, 1.0, 0.9); // white
    }
  }
}

function activateTempest(orig) {
  candleIntensityMultiplier = 0.0;
  // Camera shake (longer)
  cameraShake = { active: true, intensity: 0.15, endTime: performance.now() + 1500 };
  // Random rotation on curtains and documents
  const meshes = getMeshesByPattern(['curtain', 'documents']);
  orig.tempestMeshes = meshes.map(m => ({
    mesh: m, origRot: m.rotation.clone()
  }));
  for (const entry of orig.tempestMeshes) {
    entry.mesh.rotation.x += (Math.random() - 0.5) * 0.2;
    entry.mesh.rotation.z += (Math.random() - 0.5) * 0.2;
  }
  // Fast horizontal white/gray streak particles
  for (let i = 0; i < 200; i++) {
    const pos = new THREE.Vector3(
      (Math.random() - 0.5) * 8,
      1 + Math.random() * 4,
      (Math.random() - 0.5) * 8
    );
    const gray = 0.6 + Math.random() * 0.4;
    spawnColoredParticle(pos, gray, gray, gray);
  }
}

/* ═══════════════════════════════════════════════════════════════
   SPELL UPDATE — called every frame during active spell
   ═══════════════════════════════════════════════════════════════ */
function updateSpell(dt) {
  if (!spellState.active) return;
  const elapsed = performance.now() - spellState.startTime;
  const DURATION = 4000;
  const REVERT = 1000;

  if (elapsed > DURATION + REVERT) {
    finalizeSpellRevert();
    spellState.active = false;
    return;
  }

  // Revert phase: lerp back to originals
  if (elapsed > DURATION) {
    const t = (elapsed - DURATION) / REVERT;
    lerpToOriginals(t);
  }

  // Spell-specific per-frame updates
  updateSpellEffects(elapsed);
}

function lerpToOriginals(t) {
  const orig = spellState.originalValues;
  // Bloom
  bloomPass.strength = orig.bloomStrength + (bloomPass.strength - orig.bloomStrength) * (1 - t);
  // Candle multiplier
  candleIntensityMultiplier = candleIntensityMultiplier + (orig.candleMultiplier - candleIntensityMultiplier) * t;
  // Candle color
  if (candleColorOverride) {
    const origColor = new THREE.Color(0xffaa44);
    candleColorOverride.lerp(origColor, t);
    if (t > 0.95) candleColorOverride = null;
  }
  // Glacius mesh colors
  if (orig.glaciusMeshes) {
    for (const entry of orig.glaciusMeshes) {
      const mats = Array.isArray(entry.mesh.material) ? entry.mesh.material : [entry.mesh.material];
      mats.forEach((mt, i) => {
        if (mt.color && entry.origColors[i]) mt.color.lerp(entry.origColors[i], t);
      });
    }
  }
  // Lumos emissive
  if (orig.lumosMeshes) {
    for (const entry of orig.lumosMeshes) {
      const mats = Array.isArray(entry.mesh.material) ? entry.mesh.material : [entry.mesh.material];
      mats.forEach((mt, i) => {
        if (mt.emissive && entry.origEmissive[i]) {
          mt.emissive.lerp(entry.origEmissive[i], t);
          mt.emissiveIntensity = mt.emissiveIntensity + (entry.origEmissiveIntensity[i] - mt.emissiveIntensity) * t;
        }
      });
    }
  }
  // Ignis fire mesh scale
  if (orig.ignisMeshes) {
    for (const entry of orig.ignisMeshes) {
      entry.mesh.scale.lerp(entry.origScale, t);
    }
  }
  // Levitas positions
  if (orig.levitasMeshes) {
    for (const entry of orig.levitasMeshes) {
      entry.mesh.position.lerp(entry.origPos, t);
      entry.mesh.rotation.y += (entry.origRot.y - entry.mesh.rotation.y) * t;
    }
  }
  // Tempest rotations
  if (orig.tempestMeshes) {
    for (const entry of orig.tempestMeshes) {
      entry.mesh.rotation.x += (entry.origRot.x - entry.mesh.rotation.x) * t;
      entry.mesh.rotation.z += (entry.origRot.z - entry.mesh.rotation.z) * t;
    }
  }
  // Temp objects fade
  for (const obj of spellState.tempObjects) {
    if (obj.isLight) obj.intensity *= (1 - t);
  }
}

function updateSpellEffects(elapsed) {
  const type = spellState.type;
  const orig = spellState.originalValues;

  // Levitas: float objects upward during active phase
  if (type === 'levitas' && elapsed < 4000 && orig.levitasMeshes) {
    for (const entry of orig.levitasMeshes) {
      entry.mesh.position.y += 0.01;
      entry.mesh.rotation.y += 0.005;
    }
  }

  // Tempest: candles fade back one at a time after 3s
  if (type === 'tempest' && elapsed > 3000 && elapsed < 4000) {
    const progress = (elapsed - 3000) / 1000;
    const idx = Math.floor(progress * candleLights.length);
    for (let i = 0; i <= idx && i < candleLights.length; i++) {
      candleIntensityMultiplier = Math.max(candleIntensityMultiplier, (i + 1) / candleLights.length);
    }
  }

  // Nova: intense bloom pulse in first 500ms
  if (type === 'nova' && elapsed < 500) {
    candleIntensityMultiplier = 2.5 + (1 - elapsed / 500) * 1.5;
  }
}

function finalizeSpellRevert() {
  const orig = spellState.originalValues;
  bloomPass.strength = orig.bloomStrength;
  candleIntensityMultiplier = orig.candleMultiplier;
  candleColorOverride = null;
  // Restore candle colors
  candleLights.forEach((l, i) => l.color.setHex(orig.candleColors[i]));
  // Restore Glacius mesh colors
  if (orig.glaciusMeshes) {
    for (const entry of orig.glaciusMeshes) {
      const mats = Array.isArray(entry.mesh.material) ? entry.mesh.material : [entry.mesh.material];
      mats.forEach((mt, i) => { if (mt.color && entry.origColors[i]) mt.color.copy(entry.origColors[i]); });
    }
  }
  // Restore Lumos emissive
  if (orig.lumosMeshes) {
    for (const entry of orig.lumosMeshes) {
      const mats = Array.isArray(entry.mesh.material) ? entry.mesh.material : [entry.mesh.material];
      mats.forEach((mt, i) => {
        if (mt.emissive && entry.origEmissive[i]) { mt.emissive.copy(entry.origEmissive[i]); mt.emissiveIntensity = entry.origEmissiveIntensity[i]; }
      });
    }
  }
  // Restore Ignis fire scale
  if (orig.ignisMeshes) {
    for (const entry of orig.ignisMeshes) entry.mesh.scale.copy(entry.origScale);
  }
  // Restore Levitas positions and rotations
  if (orig.levitasMeshes) {
    for (const entry of orig.levitasMeshes) {
      entry.mesh.position.copy(entry.origPos);
      entry.mesh.rotation.copy(entry.origRot);
    }
  }
  // Restore Tempest rotations
  if (orig.tempestMeshes) {
    for (const entry of orig.tempestMeshes) entry.mesh.rotation.copy(entry.origRot);
  }
  // Remove temp objects
  for (const obj of spellState.tempObjects) {
    scene.remove(obj);
    if (obj.dispose) obj.dispose();
  }
  spellState.tempObjects = [];
  cameraShake = { active: false, intensity: 0, endTime: 0 };
}

/* ═══════════════════════════════════════════════════════════════
   WAND STATE VOICE TRIGGERS
   ═══════════════════════════════════════════════════════════════ */
function updateWandVoice(motionDetected) {
  const now = performance.now();
  const prevWandPresent = wandPresent;
  wandPresent = motionDetected;

  if (wandPresent && !prevWandPresent) {
    wandPresentTime = now;
    if (now - lastWandVoiceTime > 5000) {
      speak(VOICE_LINES.wandFound);
      lastWandVoiceTime = now;
    }
  }

  if (!wandPresent && prevWandPresent) {
    // Debounce: only announce lost after 3 seconds
    setTimeout(() => {
      if (!wandPresent && performance.now() - lastWandVoiceTime > 5000) {
        speak(VOICE_LINES.wandLost);
        lastWandVoiceTime = performance.now();
      }
    }, 3000);
  }

  // Hint after 15 seconds of wand present but no spell
  if (wandPresent && now - wandPresentTime > 15000 && now - lastSpellVoiceTime > 15000) {
    speak(VOICE_LINES.hint);
    lastSpellVoiceTime = now;
  }
}

/* ═══════════════════════════════════════════════════════════════
   SPELL HINT BAR — fade after 10 seconds
   ═══════════════════════════════════════════════════════════════ */
let hintFadeTimer = setTimeout(() => $spellHints.classList.add('faded'), 10000);
document.addEventListener('mousemove', () => {
  $spellHints.classList.remove('faded');
  clearTimeout(hintFadeTimer);
  hintFadeTimer = setTimeout(() => $spellHints.classList.add('faded'), 10000);
});

/* ═══════════════════════════════════════════════════════════════
   ANIMATION LOOP
   ═══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();

  // Update controls
  controls.update();

  // Wand detection (frame differencing → particle spawn)
  detectWand();

  // Flicker candle lights (modulated by spell multiplier)
  candleLights.forEach((light, i) => {
    const baseFlicker = 2.0 + Math.sin(time * 8 + i * 2.5) * 0.8 + Math.sin(time * 13 + i * 4) * 0.4;
    light.intensity = baseFlicker * candleIntensityMultiplier;
    if (candleColorOverride) light.color.copy(candleColorOverride);
  });

  // Update dust motes
  updateMotes(time);

  // Update wand trail particles (fade, drift, shrink)
  updateTrailParticles(dt);

  // Update active spell effects
  updateSpell(dt);

  // Camera shake (applied before render, removed after)
  let shakeOffset = null;
  if (cameraShake.active) {
    if (performance.now() > cameraShake.endTime) {
      cameraShake.active = false;
    } else {
      shakeOffset = new THREE.Vector3(
        (Math.random() - 0.5) * cameraShake.intensity * 2,
        (Math.random() - 0.5) * cameraShake.intensity * 2,
        (Math.random() - 0.5) * cameraShake.intensity * 2
      );
      camera.position.add(shakeOffset);
    }
  }

  // Render
  composer.render();

  // Remove camera shake offset after render
  if (shakeOffset) camera.position.sub(shakeOffset);

  // FPS tracking
  fpsFrames++;
  fpsTime += dt;
  if (fpsTime >= 1) {
    fps = fpsFrames / fpsTime;
    fpsFrames = 0;
    fpsTime = 0;
  }

  // Debug overlay
  if (debugMode) {
    const activeParticles = trailAlphas.filter(a => a > 0).length;
    $debugOverlay.innerHTML = `FPS: ${fps.toFixed(0)}<br>` +
      `Wand: ${wandActive ? 'active' : 'off'}<br>` +
      `Trail: ${activeParticles}/${TRAIL_COUNT}<br>` +
      `Spell: ${spellState.active ? spellState.type : 'none'}<br>` +
      `Spells cast: ${spellCount}`;
  }
}

animate();

/* ═══════════════════════════════════════════════════════════════
   RESIZE HANDLER
   ═══════════════════════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ═══════════════════════════════════════════════════════════════
   DEBUG MODE — Press D | KEYBOARD FALLBACK — Keys 1-6
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'd' || e.key === 'D') {
    debugMode = !debugMode;
    $debugOverlay.style.display = debugMode ? 'block' : 'none';
    if (debugMode) {
      console.group('Debug: Scene mesh names');
      scene.traverse((child) => {
        if (child.isMesh) {
          const verts = child.geometry?.attributes?.position?.count || 0;
          console.log(`  ${child.name || '(unnamed)'} — ${verts} vertices`);
        }
      });
      console.groupEnd();
    }
  }

  // Keyboard 1-6: cast spells
  const keyNum = parseInt(e.key);
  if (keyNum >= 1 && keyNum <= 6) {
    const spells = ['lumos', 'glacius', 'ignis', 'levitas', 'nova', 'tempest'];
    triggerSpell(spells[keyNum - 1]);
  }
});

</script>
</body>
</html>
