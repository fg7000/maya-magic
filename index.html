<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya Magic</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: Georgia, 'Times New Roman', serif; }

canvas#scene { position: fixed; inset: 0; z-index: 0; display: block; }

/* ═══════════════════════════════════════════════════════════════
   LOADING OVERLAY
   ═══════════════════════════════════════════════════════════════ */
#loading {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #0a0a1a; color: #c8a86e;
}
#loading p { font-size: 20px; opacity: 0.8; margin-bottom: 20px; }
#progress-bar-bg {
  width: 260px; height: 6px; background: rgba(200,168,110,0.15);
  border-radius: 3px; overflow: hidden;
}
#progress-bar {
  width: 0%; height: 100%; background: #c8a86e;
  border-radius: 3px; transition: width 0.2s;
}
#loading .error-msg {
  display: none; margin-top: 20px; font-size: 16px; color: #ff6644;
  max-width: 400px; text-align: center; line-height: 1.5;
}

/* ═══════════════════════════════════════════════════════════════
   TITLE OVERLAY
   ═══════════════════════════════════════════════════════════════ */
#title-screen {
  position: fixed; inset: 0; z-index: 100;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(10,10,26,0.75); color: #c8a86e; text-align: center;
  cursor: pointer; user-select: none;
}
#title-screen h1 {
  font-size: clamp(36px, 8vw, 72px); letter-spacing: 8px;
  text-shadow: 0 0 30px rgba(255,215,0,0.4), 0 0 60px rgba(255,215,0,0.2);
}
#title-screen .subtitle {
  font-size: clamp(14px, 3vw, 22px); opacity: 0.7; margin-top: 10px;
  font-style: italic;
}
#title-screen .enter-prompt {
  margin-top: 50px; font-size: 18px; opacity: 0.5;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

/* ═══════════════════════════════════════════════════════════════
   DEBUG / FPS OVERLAY
   ═══════════════════════════════════════════════════════════════ */
#debug-overlay {
  position: fixed; top: 16px; right: 16px; z-index: 200;
  font-size: 12px; color: #0f0; font-family: monospace;
  display: none; text-align: right; line-height: 1.6;
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════════
   WAND STATUS INDICATOR
   ═══════════════════════════════════════════════════════════════ */
#wand-status {
  position: fixed; top: 16px; left: 16px; z-index: 200;
  font-size: 12px; color: #c8a86e; font-family: monospace;
  opacity: 0.6; pointer-events: none;
  transition: opacity 0.5s;
}
#wand-status.active { color: #4f4; opacity: 0.8; }
#wand-status.denied { color: #f64; opacity: 0.8; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.168.0",
    "three/addons/": "https://esm.sh/three@0.168.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>

<!-- Loading overlay with progress bar -->
<div id="loading">
  <p>Loading your magic...</p>
  <div id="progress-bar-bg"><div id="progress-bar"></div></div>
  <p class="error-msg" id="error-msg"></p>
</div>

<!-- Title overlay -->
<div id="title-screen">
  <h1>MAYA MAGIC</h1>
  <p class="subtitle">Wave your wand. Speak your spell.</p>
  <p class="enter-prompt">Click to Enter</p>
</div>

<!-- Debug overlay -->
<div id="debug-overlay"></div>

<!-- Wand status indicator -->
<div id="wand-status"></div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════
   IMPORTS
   ═══════════════════════════════════════════════════════════════ */
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ═══════════════════════════════════════════════════════════════
   DOM REFS
   ═══════════════════════════════════════════════════════════════ */
const $loading = document.getElementById('loading');
const $progressBar = document.getElementById('progress-bar');
const $errorMsg = document.getElementById('error-msg');
const $titleScreen = document.getElementById('title-screen');

/* ═══════════════════════════════════════════════════════════════
   FILE:// PROTOCOL CHECK — Chrome blocks fetch() on file:// URLs
   ═══════════════════════════════════════════════════════════════ */
if (window.location.protocol === 'file:') {
  $loading.innerHTML = `
    <div style="text-align:center; color: #c8a030; padding: 2rem;">
      <h2 style="font-family: Georgia, serif;">Cannot load from file://</h2>
      <p style="color: #888; margin-top: 1rem;">Chrome blocks 3D model loading from local files. Run this in your terminal:</p>
      <code style="display: block; background: #1a1a2e; padding: 1rem; margin: 1rem auto; border-radius: 8px; color: #ffdd88; max-width: 400px;">bash start.sh</code>
      <p style="color: #888; margin-top: 0.5rem;">Or manually:</p>
      <code style="display: block; background: #1a1a2e; padding: 1rem; margin: 1rem auto; border-radius: 8px; color: #ffdd88; max-width: 400px;">python3 -m http.server 8000</code>
      <p style="color: #888; margin-top: 0.5rem;">Then open <a href="http://localhost:8000" style="color: #c8a030;">http://localhost:8000</a></p>
    </div>
  `;
  throw new Error('file:// protocol detected — need HTTP server for model loading');
}
const $debugOverlay = document.getElementById('debug-overlay');
const canvas = document.getElementById('scene');

/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
let debugMode = false;
let fpsFrames = 0;
let fpsTime = 0;
let fps = 60;

// Wand detection state
let wandActive = false;
let wandVideo = null;
let wandCanvas = null;
let wandCtx = null;
let prevFrame = null;
let smoothX = 80;   // EMA-smoothed tip position (center of 160x120)
let smoothY = 60;
const WAND_W = 160;
const WAND_H = 120;
const DIFF_THRESHOLD = 30;   // per-channel threshold
const SUM_THRESHOLD = 90;    // sum of abs diffs across RGB
const MOTION_MIN = 0.002;    // minimum motion ratio to register a wand
const EMA_ALPHA = 0.4;       // smoothing factor
const $wandStatus = document.getElementById('wand-status');

/* ═══════════════════════════════════════════════════════════════
   RENDERER
   ═══════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ═══════════════════════════════════════════════════════════════
   SCENE + CAMERA
   ═══════════════════════════════════════════════════════════════ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 3, 8);
camera.lookAt(0, 2, 0);

/* ═══════════════════════════════════════════════════════════════
   ORBIT CONTROLS
   ═══════════════════════════════════════════════════════════════ */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.minDistance = 2;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.85;
controls.target.set(0, 2, 0);

/* ═══════════════════════════════════════════════════════════════
   POST-PROCESSING
   ═══════════════════════════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.0,   // strength
  0.4,   // radius
  0.7    // threshold
);
composer.addPass(bloomPass);

/* ═══════════════════════════════════════════════════════════════
   LIGHTING
   ═══════════════════════════════════════════════════════════════ */
// Ambient
const ambientLight = new THREE.AmbientLight(0x554433, 1.0);
scene.add(ambientLight);

// 4 candle point lights
const candleLightData = [
  { pos: [-2, 3, -1] },
  { pos: [2, 3, 1] },
  { pos: [0, 4, -2] },
  { pos: [-1, 2, 2] },
];
const candleLights = candleLightData.map((d, i) => {
  const light = new THREE.PointLight(0xffaa44, 2.0, 20);
  light.decay = 1;
  light.position.set(...d.pos);
  // At least 2 cast shadows
  if (i < 2) {
    light.castShadow = true;
    light.shadow.mapSize.width = 512;
    light.shadow.mapSize.height = 512;
  }
  scene.add(light);
  return light;
});

// Moonlight (directional)
const moonLight = new THREE.DirectionalLight(0x4466aa, 0.6);
moonLight.position.set(3, 6, -4);
moonLight.castShadow = true;
moonLight.shadow.mapSize.width = 1024;
moonLight.shadow.mapSize.height = 1024;
moonLight.shadow.camera.near = 0.1;
moonLight.shadow.camera.far = 20;
moonLight.shadow.camera.left = -8;
moonLight.shadow.camera.right = 8;
moonLight.shadow.camera.top = 8;
moonLight.shadow.camera.bottom = -2;
scene.add(moonLight);

// Hemisphere fill light — cool sky, warm ground, soft fill for shadows
const hemiLight = new THREE.HemisphereLight(0x8888aa, 0x443322, 0.4);
scene.add(hemiLight);

/* ═══════════════════════════════════════════════════════════════
   DUST MOTES — 80 particles via THREE.Points
   ═══════════════════════════════════════════════════════════════ */
const MOTE_COUNT = 80;
const motePositions = new Float32Array(MOTE_COUNT * 3);
const moteSpeeds = new Float32Array(MOTE_COUNT);
const moteOpacities = new Float32Array(MOTE_COUNT);
const motePhases = new Float32Array(MOTE_COUNT);

for (let i = 0; i < MOTE_COUNT; i++) {
  motePositions[i * 3]     = (Math.random() - 0.5) * 8;   // x
  motePositions[i * 3 + 1] = Math.random() * 5;             // y
  motePositions[i * 3 + 2] = (Math.random() - 0.5) * 8;   // z
  moteOpacities[i] = Math.random();
  moteSpeeds[i] = 0.1 + Math.random() * 0.3;
  motePhases[i] = Math.random() * Math.PI * 2;
}

const moteGeometry = new THREE.BufferGeometry();
moteGeometry.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));

const moteMaterial = new THREE.PointsMaterial({
  color: 0xffdd88,
  size: 0.04,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});

const motePoints = new THREE.Points(moteGeometry, moteMaterial);
scene.add(motePoints);

function updateMotes(time) {
  const positions = moteGeometry.attributes.position.array;
  for (let i = 0; i < MOTE_COUNT; i++) {
    const i3 = i * 3;
    // Slow drift upward
    positions[i3 + 1] += moteSpeeds[i] * 0.003;
    // Gentle horizontal sway
    positions[i3] += Math.sin(time * 0.5 + motePhases[i]) * 0.001;
    positions[i3 + 2] += Math.cos(time * 0.4 + motePhases[i]) * 0.001;
    // Wrap around when too high
    if (positions[i3 + 1] > 6) {
      positions[i3 + 1] = -0.5;
      positions[i3] = (Math.random() - 0.5) * 8;
      positions[i3 + 2] = (Math.random() - 0.5) * 8;
    }
  }
  moteGeometry.attributes.position.needsUpdate = true;

  // Oscillating global opacity
  moteMaterial.opacity = 0.4 + Math.sin(time * 0.8) * 0.2;
}

/* ═══════════════════════════════════════════════════════════════
   WAND TRAIL PARTICLES — 1500 pooled via THREE.Points (ring buffer)
   ═══════════════════════════════════════════════════════════════ */
const TRAIL_COUNT = 1500;
const trailPositions = new Float32Array(TRAIL_COUNT * 3);
const trailColors    = new Float32Array(TRAIL_COUNT * 3);
const trailSizes     = new Float32Array(TRAIL_COUNT);
const trailAlphas    = new Float32Array(TRAIL_COUNT);
let trailHead = 0;

// Soft circle texture (32x32 radial gradient)
const trailTexCanvas = document.createElement('canvas');
trailTexCanvas.width = 32;
trailTexCanvas.height = 32;
const trailTexCtx = trailTexCanvas.getContext('2d');
const grad = trailTexCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(0.4, 'rgba(255,255,255,0.6)');
grad.addColorStop(1, 'rgba(255,255,255,0)');
trailTexCtx.fillStyle = grad;
trailTexCtx.fillRect(0, 0, 32, 32);
const trailTexture = new THREE.CanvasTexture(trailTexCanvas);

const trailGeometry = new THREE.BufferGeometry();
trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
trailGeometry.setAttribute('color',    new THREE.BufferAttribute(trailColors, 3));
trailGeometry.setAttribute('size',     new THREE.BufferAttribute(trailSizes, 1));

const trailMaterial = new THREE.PointsMaterial({
  size: 0.15,
  map: trailTexture,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true,
  sizeAttenuation: true,
});

const trailPoints = new THREE.Points(trailGeometry, trailMaterial);
scene.add(trailPoints);

// Raycaster for NDC → 3D mapping
const wandRaycaster = new THREE.Raycaster();
const ndcVec = new THREE.Vector2();

// Gold → orange → red color palette for trail particles
function trailColor(life) {
  // life: 1.0 = just born (gold), 0.0 = dead (red/transparent)
  const r = 1.0;
  const g = 0.4 + life * 0.45;   // gold (0.85) → orange (0.55) → red-ish (0.4)
  const b = life * 0.2;           // slight warmth at birth, fades to 0
  return [r, g, b];
}

function spawnTrailParticle(worldPos) {
  const idx = trailHead;
  trailHead = (trailHead + 1) % TRAIL_COUNT;
  const i3 = idx * 3;
  trailPositions[i3]     = worldPos.x + (Math.random() - 0.5) * 0.05;
  trailPositions[i3 + 1] = worldPos.y + (Math.random() - 0.5) * 0.05;
  trailPositions[i3 + 2] = worldPos.z + (Math.random() - 0.5) * 0.05;
  const [r, g, b] = trailColor(1.0);
  trailColors[i3] = r;
  trailColors[i3 + 1] = g;
  trailColors[i3 + 2] = b;
  trailSizes[idx] = 0.12 + Math.random() * 0.06;
  trailAlphas[idx] = 1.0;
}

function updateTrailParticles(dt) {
  const fadeRate = 1.2;  // full fade in ~0.8s
  let activeCount = 0;
  for (let i = 0; i < TRAIL_COUNT; i++) {
    if (trailAlphas[i] <= 0) continue;
    trailAlphas[i] -= fadeRate * dt;
    if (trailAlphas[i] < 0) trailAlphas[i] = 0;

    const life = trailAlphas[i];
    if (life > 0) activeCount++;
    const i3 = i * 3;
    // Drift upward slightly
    trailPositions[i3 + 1] += 0.3 * dt;
    // Color fade: gold → orange → red
    const [r, g, b] = trailColor(life);
    trailColors[i3] = r;
    trailColors[i3 + 1] = g;
    trailColors[i3 + 2] = b;
    // Shrink
    trailSizes[i] = trailSizes[i] * (0.97 + life * 0.02);
  }
  trailGeometry.attributes.position.needsUpdate = true;
  trailGeometry.attributes.color.needsUpdate = true;
  trailGeometry.attributes.size.needsUpdate = true;

  // Global opacity modulates by active particle ratio
  trailMaterial.opacity = activeCount > 0 ? 0.9 : 0;
}

/* ═══════════════════════════════════════════════════════════════
   LOAD FBX model
   ═══════════════════════════════════════════════════════════════ */
const loader = new FBXLoader();

function logMeshInfo(object) {
  console.group('Scene meshes loaded:');
  let texturedCount = 0;
  let untexturedCount = 0;
  object.traverse((child) => {
    if (child.isMesh) {
      const verts = child.geometry?.attributes?.position?.count || 0;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      const matNames = mats.map(m => m?.name || '(no material)').join(', ');
      const hasMap = mats.some(m => m && m.map);
      const mapInfo = mats.map(m => {
        if (m && m.map) return `map=${m.map.image?.width}x${m.map.image?.height} colorSpace=${m.map.colorSpace}`;
        return 'map=null';
      }).join(' | ');
      console.log(`  ${child.name || '(unnamed)'} — ${verts} verts, mat="${matNames}", ${mapInfo}`);
      if (hasMap) texturedCount++; else untexturedCount++;
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  console.log(`TEXTURE SUMMARY: ${texturedCount} textured, ${untexturedCount} untextured`);
  console.groupEnd();
}

loader.load(
  'model/source/DumbledoreOffice.fbx',
  // onLoad — FBXLoader returns the Group directly (no wrapper)
  (model) => {
    // Enable shadows on all meshes and log info
    logMeshInfo(model);

    // Fix texture color space — FBX textures need SRGBColorSpace in Three.js r168
    // FBX meshes can have material arrays, so handle both single and array cases
    model.traverse((child) => {
      if (child.isMesh && child.material) {
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        for (const mat of materials) {
          if (mat.map) {
            mat.map.colorSpace = THREE.SRGBColorSpace;
            mat.map.needsUpdate = true;
          }
          mat.needsUpdate = true;
        }
      }
    });

    scene.add(model);

    // Scale model to ~10 units (native size is ~0.1 units)
    const rawBox = new THREE.Box3().setFromObject(model);
    const rawSize = rawBox.getSize(new THREE.Vector3());
    const rawMax = Math.max(rawSize.x, rawSize.y, rawSize.z);
    const TARGET_SIZE = 10;
    const scaleFactor = TARGET_SIZE / rawMax;
    model.scale.setScalar(scaleFactor);
    console.log(`Model native size: ${rawSize.x.toFixed(3)} x ${rawSize.y.toFixed(3)} x ${rawSize.z.toFixed(3)} — scaling ${scaleFactor.toFixed(1)}x`);

    // Recompute bounding box after scaling
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    // Adjust controls target to model center
    controls.target.copy(center);
    camera.position.set(center.x, center.y + maxDim * 0.3, center.z + maxDim * 0.8);
    camera.lookAt(center);
    controls.update();

    // Camera collision bounds — keep camera inside the room
    controls.maxDistance = maxDim * 0.9;

    console.log(`Scaled bounding box: ${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`);
    console.log(`Center: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})`);

    // Hide loading, show title
    $loading.style.display = 'none';
    $titleScreen.style.display = 'flex';

    // Pre-render one frame so scene shows behind title
    composer.render();
  },
  // onProgress
  (xhr) => {
    if (xhr.total > 0) {
      const pct = Math.round((xhr.loaded / xhr.total) * 100);
      $progressBar.style.width = pct + '%';
    }
  },
  // onError
  (error) => {
    console.error('Failed to load FBX model:', error);
    $progressBar.parentElement.style.display = 'none';
    $errorMsg.style.display = 'block';
    $errorMsg.textContent = 'Could not load the magic room. Make sure model/source/DumbledoreOffice.fbx and its textures are present.';
  }
);

/* ═══════════════════════════════════════════════════════════════
   WAND DETECTION — frame differencing on 160x120 hidden canvas
   ═══════════════════════════════════════════════════════════════ */
function detectWand() {
  if (!wandActive || !wandVideo || wandVideo.readyState < 2) return;

  // Draw current frame, downscaled to 160x120
  wandCtx.drawImage(wandVideo, 0, 0, WAND_W, WAND_H);
  const currentFrame = wandCtx.getImageData(0, 0, WAND_W, WAND_H);
  const curr = currentFrame.data;

  if (!prevFrame) {
    prevFrame = currentFrame;
    return;
  }

  const prev = prevFrame.data;
  let totalMotion = 0;
  let sumX = 0;
  let sumY = 0;

  // Frame differencing: compare RGB channels, threshold
  for (let i = 0; i < curr.length; i += 4) {
    const dr = Math.abs(curr[i]     - prev[i]);
    const dg = Math.abs(curr[i + 1] - prev[i + 1]);
    const db = Math.abs(curr[i + 2] - prev[i + 2]);

    if ((dr > DIFF_THRESHOLD || dg > DIFF_THRESHOLD || db > DIFF_THRESHOLD)
        && (dr + dg + db) > SUM_THRESHOLD) {
      const pixelIndex = i / 4;
      const px = pixelIndex % WAND_W;
      const py = Math.floor(pixelIndex / WAND_W);
      sumX += px;
      sumY += py;
      totalMotion++;
    }
  }

  prevFrame = currentFrame;

  // motionRatio denominator is pixel count, NOT byte count (prior learning applied)
  const motionRatio = totalMotion / (WAND_W * WAND_H);

  if (motionRatio < MOTION_MIN) return;   // too little motion, skip

  // Centroid of motion region
  const cx = sumX / totalMotion;
  const cy = sumY / totalMotion;

  // EMA smoothing
  smoothX = smoothX * (1 - EMA_ALPHA) + cx * EMA_ALPHA;
  smoothY = smoothY * (1 - EMA_ALPHA) + cy * EMA_ALPHA;

  // Map 2D tip to NDC (mirror X for natural feel)
  ndcVec.x = -(smoothX / WAND_W) * 2 + 1;
  ndcVec.y = -(smoothY / WAND_H) * 2 + 1;

  // Unproject to 3D at depth 2.0 from camera
  wandRaycaster.setFromCamera(ndcVec, camera);
  const origin = wandRaycaster.ray.origin.clone();
  const dir = wandRaycaster.ray.direction.clone();
  const worldPos = origin.add(dir.multiplyScalar(2.0));

  // Spawn 3-5 trail particles per frame when motion detected
  const count = 3 + Math.floor(Math.random() * 3);
  for (let j = 0; j < count; j++) {
    spawnTrailParticle(worldPos);
  }
}

/* ═══════════════════════════════════════════════════════════════
   TITLE SCREEN — Click to dismiss + request camera
   ═══════════════════════════════════════════════════════════════ */
$titleScreen.addEventListener('click', () => {
  if (wandVideo) return;  // prevent duplicate camera streams on double-click
  $titleScreen.style.display = 'none';

  // Request camera (requires user gesture)
  navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
    .then((stream) => {
      wandVideo = document.createElement('video');
      wandVideo.srcObject = stream;
      wandVideo.setAttribute('playsinline', '');
      wandVideo.style.display = 'none';
      document.body.appendChild(wandVideo);
      wandVideo.play();

      wandCanvas = document.createElement('canvas');
      wandCanvas.width = WAND_W;
      wandCanvas.height = WAND_H;
      wandCtx = wandCanvas.getContext('2d', { willReadFrequently: true });

      wandActive = true;
      $wandStatus.textContent = 'Wand: Ready';
      $wandStatus.className = 'active';
      console.log('Wand detection active (160x120 frame differencing)');
    })
    .catch((err) => {
      console.warn('Camera denied or unavailable:', err.message);
      $wandStatus.textContent = 'Wand: Camera off';
      $wandStatus.className = 'denied';
      // Graceful degradation — app works without camera, use keyboard 1-6
    });
});

window.addEventListener('beforeunload', () => {
  if (wandVideo && wandVideo.srcObject) {
    wandVideo.srcObject.getTracks().forEach(t => t.stop());
  }
});

/* ═══════════════════════════════════════════════════════════════
   ANIMATION LOOP
   ═══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();

  // Update controls
  controls.update();

  // Wand detection (frame differencing → particle spawn)
  detectWand();

  // Flicker candle lights
  candleLights.forEach((light, i) => {
    light.intensity = 2.0 + Math.sin(time * 8 + i * 2.5) * 0.8 + Math.sin(time * 13 + i * 4) * 0.4;
  });

  // Update dust motes
  updateMotes(time);

  // Update wand trail particles (fade, drift, shrink)
  updateTrailParticles(dt);

  // Render
  composer.render();

  // FPS tracking
  fpsFrames++;
  fpsTime += dt;
  if (fpsTime >= 1) {
    fps = fpsFrames / fpsTime;
    fpsFrames = 0;
    fpsTime = 0;
  }

  // Debug overlay
  if (debugMode) {
    const activeParticles = trailAlphas.filter(a => a > 0).length;
    $debugOverlay.innerHTML = `FPS: ${fps.toFixed(0)}<br>` +
      `Wand: ${wandActive ? 'active' : 'off'}<br>` +
      `Trail: ${activeParticles}/${TRAIL_COUNT}`;
  }
}

animate();

/* ═══════════════════════════════════════════════════════════════
   RESIZE HANDLER
   ═══════════════════════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* ═══════════════════════════════════════════════════════════════
   DEBUG MODE — Press D | KEYBOARD FALLBACK — Keys 1-6
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'd' || e.key === 'D') {
    debugMode = !debugMode;
    $debugOverlay.style.display = debugMode ? 'block' : 'none';
    if (debugMode) {
      console.group('Debug: Scene mesh names');
      scene.traverse((child) => {
        if (child.isMesh) {
          const verts = child.geometry?.attributes?.position?.count || 0;
          console.log(`  ${child.name || '(unnamed)'} — ${verts} vertices`);
        }
      });
      console.groupEnd();
    }
  }

  // Keyboard 1-6: test particle bursts at random 3D positions
  const keyNum = parseInt(e.key);
  if (keyNum >= 1 && keyNum <= 6) {
    const burstPos = new THREE.Vector3(
      (Math.random() - 0.5) * 4,
      1 + Math.random() * 3,
      (Math.random() - 0.5) * 4
    );
    const burstCount = 30 + Math.floor(Math.random() * 20);
    for (let j = 0; j < burstCount; j++) {
      spawnTrailParticle(burstPos);
    }
    console.log(`Test burst (key ${keyNum}): ${burstCount} particles at (${burstPos.x.toFixed(1)}, ${burstPos.y.toFixed(1)}, ${burstPos.z.toFixed(1)})`);
  }
});

</script>
